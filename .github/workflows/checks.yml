# Runs on every push / pull request once the repo is on GitHub:
#   rls → the 48-line attack suite against a fresh Postgres 16 (migrations + policies must pass 48/48)
#   web → lint, type-check and production build (smoke tests need Chrome on a Mac and stay local for now)
name: checks
on: [push, pull_request]
jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: supabase/tests/run-ci.sh
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
        env: { VITE_BACKEND: mock, VITE_DEMO: 'false' }
