[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every path is served by index.html (React Router handles it)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP (councils 1 Nov): ran REPORT-ONLY first; ENFORCED since the 2 Nov release (production console clean after a full
    # reload of every section — 0 reports). A new outside host (fonts, analytics, CDN…) must be added here first.
    # Both Supabase projects are listed so branch deploys (staging) and production share one header.
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://ltwnqtbxntxyyujqiglb.supabase.co https://fvhalabzjbyzgwqfqqul.supabase.co; media-src 'self' blob: https://ltwnqtbxntxyyujqiglb.supabase.co https://fvhalabzjbyzgwqfqqul.supabase.co; connect-src 'self' https://ltwnqtbxntxyyujqiglb.supabase.co wss://ltwnqtbxntxyyujqiglb.supabase.co https://fvhalabzjbyzgwqfqqul.supabase.co wss://fvhalabzjbyzgwqfqqul.supabase.co; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests"

# Branch deploys (e.g. the `social` branch → https://social--hamsha-studio.netlify.app) and PR previews
# talk to the STAGING Supabase project, never to production. These are public values (publishable key);
# netlify.toml context values override the UI variables, which keep pointing production at `hamsha`.
[context.branch-deploy.environment]
  VITE_SUPABASE_URL = "https://fvhalabzjbyzgwqfqqul.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_N426aY8pX3C4h5weuN0lPg_0WNiDm2r"

[context.deploy-preview.environment]
  VITE_SUPABASE_URL = "https://fvhalabzjbyzgwqfqqul.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_N426aY8pX3C4h5weuN0lPg_0WNiDm2r"
