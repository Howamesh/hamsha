[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every path is served by index.html (React Router handles it)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Branch deploys (e.g. the `social` branch → https://social--hamsha-studio.netlify.app) and PR previews
# talk to the STAGING Supabase project, never to production. These are public values (publishable key);
# netlify.toml context values override the UI variables, which keep pointing production at `hamsha`.
[context.branch-deploy.environment]
  VITE_SUPABASE_URL = "https://fvhalabzjbyzgwqfqqul.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_N426aY8pX3C4h5weuN0lPg_0WNiDm2r"

